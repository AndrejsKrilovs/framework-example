databaseChangeLog:
  - changeSet:
      id: 003-create-refund
      author: andrejs.krilovs
      changes:
        # increment must match allocationSize of the @SequenceGenerator in Refund
        - createSequence:
            sequenceName: refund_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: refund
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: payment_transaction
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_refund_payment_transaction
                    references: payment_transaction(id)
              - column:
                  name: amount
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              # RefundStatus, stored by name
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(500)
        - createIndex:
            tableName: refund
            indexName: idx_refund_payment_transaction
            columns:
              - column:
                  name: payment_transaction
